<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0;url=https://contextpacker.vercel.app/" />
    <title>Redirection vers ContextPacker</title>
    <script>
      const target = new URL('https://contextpacker.vercel.app/');
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    </script>
  </head>
  <body>
    <p>
      Redirection vers
      <a href="https://contextpacker.vercel.app/">ContextPacker</a>.
    </p>
  </body>
</html>
